[package]
name = "ramlight"
version = "0.1.0"
edition = "2021"
description = "Lekki monitor RAM w zasobniku Windows"
license = "MIT"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.37"
windows = { version = "0.61", features = ["Win32_System_ProcessStatus"] }
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"

[profile.release]
opt-level = "s"
lto = false
codegen-units = 4
strip = true
